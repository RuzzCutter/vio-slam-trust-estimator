# F2-ablation: MH_04 D1, w/o f1/f2/f3, n=5. full из F2-P.
# python3 scripts/run_batch.py --plan config/batch_f2_ablation.yaml

id: f2_ablation
kind: ablation
description: "F2 ablation MH_04 D1 σ=5 w/o f1,f2,f3 (f4 not in R)"

eval: true
repeats: 5

advanced:
  retries: 3
  trust_tau: 5.0

runs:
  - seq: MH_04_difficult
    degrade: gaussian:5
    ablate: f1
  - seq: MH_04_difficult
    degrade: gaussian:5
    ablate: f2
  - seq: MH_04_difficult
    degrade: gaussian:5
    ablate: f3
